spring:
  application:
    name: student-service-platform-backend
  profiles:
    active: kingbase
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

platform:
  security:
    jwt-secret: change-me-in-production
    jwt-expire-seconds: 7200
    max-failed-login-attempts: 5
    lock-duration-minutes: 30
    default-password: 123456
    require-password-reset-on-create: true
  storage:
    upload-dir: ./data/uploads
    export-dir: ./data/exports
  upload:
    max-file-size-bytes: 20971520
    allowed-content-types: application/pdf,image/png,image/jpeg,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
    allow-empty-content-type: false
  search:
    # 每一组都是“互为同义词/近义词”的词表
    # 查询中命中任意一个词，都会扩展到整组词再参与打分
synonyms:
  # === 核心/升学/学业模块 ===
  - [保研, 推免, 免推, 推免生, 推荐免试, 保送]
  - [考研, 研究生考试, 考研初试, 考研复试]
  - [综测, 综合测评, 德育分, 综合素质评价, 综测加分]
  - [学业预警, 挂科, 不及格, 学分缺口, 学分不够, 重修, 补考]
  - [成绩单, 成绩证明, 学籍成绩单, 成绩单打印, 绩点查询]
  - [培养方案, 教学计划, 选课要求, 课程模块, 毕业要求]
  - [选课, 选课建议, 抢课, 退选, 补选]

  # === 模块一 & 模块六：证明开具、办事指南与模板 ===
  - [在读证明, 证明, 盖章申请, 盖章证明, 开证明, 证明开具]
  - [请假条, 请假申请, 事假, 病假, 销假, 离校申请]
  - [模板, 表格, 申请表, 下载模板, 办事指南, 流程表]
  - [预算表, 经费预算, 活动预算, 财务报销]
  - [活动简报, 新闻稿, 简报模板, 总结报告]
  - [原文溯源, 政策来源, 依据文件, 原始文件, 附件下载]

  # === 模块二：党团事务流程管理 ===
  - [党团关系, 组织关系, 团组织关系, 党组织关系, 转接组织关系]
  - [入党, 党员发展, 发展党员, 预备党员, 积极分子, 发展对象, 入党申请]
  - [入团, 团员发展, 团组织, 共青团, 入团申请]
  - [思想汇报, 季度汇报, 思想总结, 理论学习汇报]
  - [理论自测, 党建题库, 团建题库, 刷题自测, 理论考试]
  - [流程可视化, 进度追踪, 办理进展, 审核状态]

  # === 模块三 & 模块四：学生画像、基础信息与荣誉 ===
  - [学生画像, 个人档案, 基础信息, 学生基本信息]
  - [成长经历, 履历, 简历信息, 科研竞赛, 社会实践, 志愿服务, 干部任职]
  - [政治面貌, 党员身份, 团员身份, 群众]
  - [国家奖学金, 国奖, 励志奖学金, 奖助学金, 评奖评优]
  - [先进集体, 优秀班集体, 优秀团支部, 先进班级]
  - [校优, 优秀学生, 优秀团员, 三好学生, 优秀学生干部]
  - [榜样宣传, 先进事迹, 风采展示, 优秀典型]

  # === 模块五：信息集成与精准推送 ===
  - [通知, 公告, 通知公告, 校内通知, 学院通知]
  - [标签化分发, 精准推送, 定向发送, 按年级推送]
  - [站内消息, 系统消息, 消息通知]
  - [微信提醒, 企业微信, 微信通知]
  - [阅读追踪, 已读未读, 催办, 签收状态]
  - [历史归档, 归档管理, 往期通知, 历史查询]

  # === 组织机构与常用校内口语 ===
  - [辅导员, 导员, 班主任, 辅导员老师]
  - [教务处, 教务科, 教务老师, 教务系统]
  - [学工处, 学工部, 学生处, 学工系统, 老师办公室]
  - [宿舍调整, 换寝室, 换宿舍, 调寝, 换床位, 退宿, 搬宿舍]
  - [教师资格, 教资, 教师资格证, 教资申请, 教资认定]
  - [实习, 就业实习, 毕业实习, 实习证明, 找工作]