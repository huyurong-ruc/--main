<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理后台登录</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: radial-gradient(1200px 600px at 50% -10%, rgba(37,99,235,.35), rgba(2,6,23,.92)); color: #0f172a; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: 100%; max-width: 520px; background: rgba(255,255,255,.96); border: 1px solid rgba(15,23,42,.10); border-radius: 16px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
    h1 { margin: 0 0 10px; font-size: 20px; font-weight: 950; letter-spacing: .2px; }
    .sub { margin: 0 0 16px; font-size: 13px; color: #475569; line-height: 1.6; }
    label { display:block; font-size: 13px; color: #334155; font-weight: 850; margin: 12px 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 12px 12px; border-radius: 12px; border: 1px solid rgba(15,23,42,.14); background: #ffffff; color: #0f172a; outline: none; font-size: 16px; }
    input:focus { border-color: rgba(37,99,235,.7); box-shadow: 0 0 0 4px rgba(37,99,235,.14); }
    .row { display:flex; gap: 10px; align-items: center; margin-top: 16px; }
    button { flex: 1; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(15,23,42,.12); background: #2563eb; color: white; cursor: pointer; font-weight: 900; }
    button:hover { filter: brightness(1.02); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .ghost { background: transparent; color: #334155; }
    .msg { margin-top: 12px; min-height: 18px; font-size: 13px; color: #b91c1c; font-weight: 800; }
    .hint { margin-top: 14px; font-size: 12px; color: #475569; }
    code { background: rgba(15,23,42,.06); padding: 2px 6px; border-radius: 6px; color: #0f172a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>管理后台登录</h1>
      <p class="sub">使用后端演示账号登录后，将自动跳转到管理后台首页。</p>
      <form id="loginForm">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" placeholder="admin" required />
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="123456" required />
        <div class="row">
          <button id="submitBtn" type="submit">登录</button>
          <button id="resetBtn" class="ghost" type="button">清空</button>
        </div>
        <div id="msg" class="msg"></div>
      </form>
      <div class="hint">演示账号：<code>admin / 123456</code></div>
    </div>
  </div>
  <script>
    const TOKEN_KEY = "ssp_admin_token";
    const USER_KEY = "ssp_admin_user";
    if (localStorage.getItem(TOKEN_KEY)) {
      location.replace("/admin.html");
    }
    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");
    const resetBtn = document.getElementById("resetBtn");
    const msg = document.getElementById("msg");
    resetBtn.addEventListener("click", () => {
      form.reset();
      msg.textContent = "";
    });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      submitBtn.disabled = true;
      try {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const resp = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const json = await resp.json().catch(() => null);
        if (!resp.ok || !json || !json.success) {
          msg.textContent = (json && json.message) ? json.message : ("登录失败(" + resp.status + ")");
          return;
        }
        localStorage.setItem(TOKEN_KEY, json.data.token);
        localStorage.setItem(USER_KEY, JSON.stringify({ userId: json.data.userId, username: json.data.username, role: json.data.role }));
        location.replace("/admin.html");
      } catch (err) {
        msg.textContent = "网络错误或服务未启动";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
