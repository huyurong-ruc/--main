<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理后台</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --panel2: #f8fafc;
      --border: rgba(15,23,42,.12);
      --text: #0f172a;
      --muted: #64748b;
      --brand: #2563eb;
      --danger: #ef4444;
      --ok: #22c55e;
      --warn: #f59e0b;
      --header-h: 56px;
      --sidebar-w: 280px;
      --header-bg: #1741b5;
      --header-text: #ffffff;
      --shadow: 0 10px 30px rgba(0,0,0,.22);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: var(--header-bg); color: var(--header-text); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; z-index: 20; box-shadow: var(--shadow); }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 280px; }
    .header-title { font-weight: 800; letter-spacing: .4px; }
    .header-center { flex: 1; display: flex; align-items: center; justify-content: center; }
    .pageTitle { font-size: 16px; font-weight: 750; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .iconBtn { position: relative; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.12); color: var(--header-text); padding: 8px 10px; border-radius: 10px; cursor: pointer; font-weight: 700; }
    .iconBtn:hover { background: rgba(255,255,255,.18); }
    .badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; background: #ef4444; color: white; border-radius: 999px; font-size: 11px; border: 2px solid var(--header-bg); }
    .menu { position: absolute; top: calc(var(--header-h) - 8px); right: 14px; width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); display: none; z-index: 30; overflow: hidden; }
    .menu.show { display: block; }
    .menuHeader { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .menuTitle { font-weight: 760; }
    .menuBody { max-height: 360px; overflow: auto; }
    .menuItem { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .menuItem:hover { background: rgba(15,23,42,.04); }
    .menuItemTitle { font-weight: 720; }
    .menuItemSub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .menuFooter { padding: 10px 12px; display: flex; justify-content: flex-end; gap: 8px; }

    .app { position: fixed; top: var(--header-h); left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: var(--sidebar-w) 1fr; }
    .sidebar { border-right: 1px solid var(--border); background: var(--panel); padding: 12px; overflow: auto; }
    .brand { font-weight: 800; font-size: 13px; letter-spacing: .2px; margin: 4px 6px 8px; color: var(--text); }
    .sub { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0 6px 12px; }
    .nav { display: grid; gap: 8px; padding: 0 4px 10px; }
    .nav button { width: 100%; text-align: left; padding: 10px 10px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text); cursor: pointer; }
    .nav button.sub { padding-left: 18px; }
    .nav button:hover { border-color: var(--border); background: rgba(15,23,42,.03); }
    .nav button.active { border-color: rgba(37,99,235,.35); background: rgba(37,99,235,.10); }
    .group { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: rgba(255,255,255,.02); }
    .groupHeader { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px; background: rgba(15,23,42,.04); border: 0; color: var(--text); cursor: pointer; font-weight: 760; }
    .groupHeader:hover { background: rgba(15,23,42,.06); }
    .groupChevron { opacity: .9; transition: transform .15s ease; }
    .groupItems { display: grid; gap: 6px; padding: 8px; }
    .group.collapsed .groupItems { display: none; }
    .group.collapsed .groupChevron { transform: rotate(-90deg); }

    .main { overflow: auto; padding: 16px 18px 24px; }
    .btn { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: rgba(15,23,42,.03); color: var(--text); cursor: pointer; font-weight: 650; }
    .btn.primary { background: var(--brand); border-color: rgba(255,255,255,.12); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .metric .k { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .metric .v { font-size: 22px; font-weight: 760; }
    .row { display:flex; gap: 10px; flex-wrap: wrap; }
    .field { display:flex; flex-direction: column; gap: 6px; min-width: 160px; }
    .field label { font-size: 12px; color: var(--muted); }
    .field input, .field select { padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); outline: none; }
    .field textarea { padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); outline: none; min-height: 92px; resize: vertical; }
    .field input:focus, .field select:focus { border-color: rgba(99,102,241,.7); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    .field textarea:focus { border-color: rgba(99,102,241,.7); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
    th { text-align: left; color: var(--muted); font-weight: 650; }
    td .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12px; color: #334155; }
    .noticeTable { table-layout: fixed; }
    .noticeTable th, .noticeTable td { padding: 8px 8px; }
    .noticeTable th:nth-child(1), .noticeTable td:nth-child(1) { width: 38%; }
    .noticeTable th:nth-child(2), .noticeTable td:nth-child(2) { width: 10%; }
    .noticeTable th:nth-child(3), .noticeTable td:nth-child(3) { width: 10%; }
    .noticeTable th:nth-child(4), .noticeTable td:nth-child(4) { width: 10%; }
    .noticeTable th:nth-child(5), .noticeTable td:nth-child(5) { width: 13%; }
    .noticeTable th:nth-child(6), .noticeTable td:nth-child(6) { width: 19%; text-align: right; }
    .noticeTitleMain { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .noticeTitleSub { color: var(--muted); font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .noticeTable .iconActions { justify-content: flex-end; flex-wrap: wrap; gap: 6px; }
    .noticeTable .iconAction { padding: 5px 6px; border-radius: 9px; }
    .tag { display:inline-flex; align-items:center; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,.03); font-size: 12px; }
    .tag.ok { border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.12); }
    .tag.bad { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.12); }
    .tag.warn { border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.12); }
    .footer { display:flex; align-items:center; justify-content: space-between; gap: 12px; margin-top: 12px; color: var(--muted); font-size: 12px; }
    .pager { display:flex; gap: 8px; align-items: center; }
    .opPageHeader { display:flex; align-items:flex-start; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
    .opPageHeader h2 { margin: 0; font-size: 22px; font-weight: 900; }
    .opDesc { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .opExportBtn { display:inline-flex; align-items:center; gap: 8px; padding: 8px 12px; border-radius: 10px; border: 0; background: var(--brand); color: #ffffff; cursor: pointer; font-weight: 750; }
    .opExportBtn:hover { filter: brightness(1.02); }
    .opExportBtn svg { width: 14px; height: 14px; }
    .opFilterCard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .opFiltersRow { display:flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .opControl { min-width: 160px; flex: 0 0 160px; }
    .opControl.wide { min-width: 200px; flex: 0 0 200px; }
    .opControl select, .opControl input { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); outline: none; }
    .opControl input:focus, .opControl select:focus { border-color: rgba(99,102,241,.7); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    .opFilterBtn { display:inline-flex; align-items:center; gap: 8px; padding: 9px 16px; border-radius: 10px; border: 0; background: var(--brand); color: #ffffff; cursor: pointer; font-weight: 800; }
    .opFilterBtn svg { width: 14px; height: 14px; }
    .opDateRow { display:flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
    .opDateField { display:flex; flex-direction: column; gap: 6px; min-width: 240px; flex: 0 0 240px; }
    .opDateLabel { font-size: 12px; color: var(--muted); }
    .opDateWrap { position: relative; }
    .opDateWrap input { padding-right: 34px; }
    .opDateIcon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); opacity: .55; pointer-events: none; }
    .opTable { width: 100%; border-collapse: collapse; }
    .opTable th, .opTable td { padding: 10px 10px; border-bottom: 1px solid rgba(15,23,42,.08); font-size: 13px; vertical-align: middle; }
    .opTable th { background: rgba(15,23,42,.03); color: var(--muted); font-weight: 700; font-size: 12px; }
    .opMono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12px; color: #334155; }
    .opPill { display:inline-flex; align-items:center; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; font-weight: 800; }
    .opPill.success { border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.12); color: #166534; }
    .opPill.fail { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.12); color: #b91c1c; }
    .opPill.info { border-color: rgba(37,99,235,.35); background: rgba(37,99,235,.10); color: #1d4ed8; }
    .opPill.error { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.10); color: #b91c1c; }
    .opLink { display:inline-flex; align-items:center; gap: 6px; color: #2563eb; font-weight: 800; cursor: pointer; }
    .opLink:hover { text-decoration: underline; }
    .opFooter { display:flex; align-items:center; justify-content: space-between; gap: 12px; margin-top: 12px; color: var(--muted); font-size: 12px; }
    .opPager { display:flex; align-items:center; gap: 6px; }
    .opPageBtn { border: 1px solid rgba(15,23,42,.12); background: var(--panel); padding: 5px 9px; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--text); }
    .opPageBtn:hover { background: rgba(15,23,42,.03); }
    .opPageBtn.active { background: rgba(37,99,235,.10); border-color: rgba(37,99,235,.35); color: #1d4ed8; font-weight: 850; }
    .opPageBtn:disabled { opacity: .55; cursor: not-allowed; }
    .opTips { margin-top: 14px; background: #fffbeb; border: 1px solid rgba(245,158,11,.35); border-radius: 12px; padding: 12px; color: #92400e; }
    .opTipsTitle { display:flex; align-items:center; gap: 8px; font-weight: 900; }
    .opTips ul { margin: 8px 0 0 18px; padding: 0; font-size: 12px; line-height: 1.7; }
    .toast { margin-top: 10px; min-height: 18px; font-size: 13px; color: #b91c1c; }
    .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(1200px 600px at 50% -10%, rgba(37,99,235,.35), rgba(2,6,23,.75)); backdrop-filter: blur(10px); z-index: 50; overflow: auto; }
    .overlay.show { display: flex; }
    .login { width: 100%; max-width: 520px; background: rgba(255,255,255,.96); border: 1px solid rgba(15,23,42,.10); border-radius: 16px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
    .login h2 { margin: 0 0 8px; font-size: 20px; font-weight: 950; color: #0f172a; letter-spacing: .2px; }
    .login p { margin: 0 0 16px; font-size: 13px; color: #475569; line-height: 1.6; }
    .login .field label { font-size: 13px; color: #334155; font-weight: 850; }
    .login .field input { font-size: 16px; padding: 12px 12px; border-radius: 12px; background: #ffffff; }
    .login .actions { display:flex; gap: 10px; margin-top: 16px; }
    .login .actions .btn { padding: 10px 12px; border-radius: 12px; font-weight: 900; }
    .login .toast { margin-top: 12px; color: #b91c1c; font-weight: 800; }
    .pageHeader { display:flex; align-items:flex-start; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
    .pageHeader h2 { margin: 0; font-size: 22px; font-weight: 900; }
    .pageHeader .desc { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .pageHeader .actions { display:flex; gap: 10px; align-items:center; }
    .btn.primary { color: #ffffff; }
    .btn.green { background: #16a34a; border-color: rgba(22,163,74,.25); color: #ffffff; }
    .btn.green:hover { filter: brightness(1.02); }
    .iconActions { display:flex; gap: 8px; align-items:center; }
    .iconAction { border: 1px solid var(--border); background: rgba(15,23,42,.03); color: var(--text); padding: 6px 8px; border-radius: 10px; cursor: pointer; font-weight: 850; line-height: 1; }
    .iconAction:hover { background: rgba(37,99,235,.06); border-color: rgba(37,99,235,.25); }
    .linkAction { border: 0; background: transparent; padding: 0; cursor: pointer; font-weight: 850; color: #2563eb; }
    .linkAction.danger { color: #ef4444; }
    .linkAction:hover { text-decoration: underline; }
    .statusPill { display:inline-flex; align-items:center; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 850; border: 1px solid var(--border); }
    .statusPill.ok { background: rgba(22,163,74,.10); border-color: rgba(22,163,74,.25); color: #166534; }
    .statusPill.bad { background: rgba(239,68,68,.10); border-color: rgba(239,68,68,.25); color: #b91c1c; }
    .modal { width: 100%; max-width: 820px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
    .modalHeader { display:flex; align-items:center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .modalTitle { font-weight: 900; font-size: 16px; }
    .modalBody { display: grid; gap: 10px; }
    .modalFooter { display:flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .dashHeader { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .dashTitle { font-size: 22px; font-weight: 850; margin: 0; }
    .dashSub { margin-top: 6px; font-size: 13px; color: var(--muted); }
    .dashDate { text-align: right; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .sectionTitle { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; font-weight: 820; }
    .todoGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .todoCard { width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background .12s ease, border-color .12s ease, transform .12s ease; }
    .todoCard:hover { background: rgba(37,99,235,.04); border-color: rgba(37,99,235,.25); transform: translateY(-1px); }
    .todoIcon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 900; }
    .todoMeta { display: grid; gap: 2px; }
    .todoLabel { font-size: 12px; color: var(--muted); }
    .todoValue { font-size: 22px; font-weight: 850; }
    .actionGrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .actionTile { border: 0; border-radius: 12px; padding: 14px; min-height: 92px; color: white; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 20px rgba(0,0,0,.08); }
    .actionIcon { width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 22px; font-weight: 900; }
    .actionText { font-weight: 820; }
    .kpiGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .kpiCard { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; box-shadow: 0 10px 20px rgba(0,0,0,.05); }
    .kpiLeft { display: grid; gap: 8px; }
    .kpiTitle { font-size: 14px; color: var(--muted); font-weight: 700; }
    .kpiValue { font-size: 34px; font-weight: 900; letter-spacing: .2px; }
    .kpiDelta { font-size: 14px; font-weight: 800; }
    .kpiDelta.pos { color: #16a34a; }
    .kpiDelta.neg { color: #ef4444; }
    .kpiDelta.zero { color: var(--muted); }
    .kpiIconWrap { width: 56px; height: 56px; border-radius: 16px; background: rgba(15,23,42,.05); display: grid; place-items: center; }
    .kpiIcon { font-size: 22px; font-weight: 900; color: rgba(15,23,42,.55); }
    .activityCard { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; box-shadow: 0 10px 20px rgba(0,0,0,.05); }
    .activityRow { display: grid; grid-template-columns: 76px 16px 1fr; gap: 12px; align-items: center; padding: 12px 8px; border-top: 1px solid rgba(15,23,42,.06); }
    .activityRow:first-child { border-top: 0; }
    .activityTime { color: var(--muted); font-weight: 750; }
    .activityDot { width: 10px; height: 10px; border-radius: 999px; }
    .activityText { font-weight: 780; }
    .activitySub { margin-top: 4px; font-size: 12px; color: var(--muted); }

    .flowPageHeader { display:flex; align-items:flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .flowPageHeader h2 { margin: 0; font-size: 22px; font-weight: 900; }
    .flowPageDesc { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .flowBtn { display:inline-flex; align-items:center; gap: 8px; padding: 9px 14px; border-radius: 10px; border: 0; background: var(--brand); color: #ffffff; cursor: pointer; font-weight: 850; }
    .flowBtn:hover { filter: brightness(1.02); }
    .flowTag { display:inline-flex; align-items:center; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 850; border: 1px solid rgba(15,23,42,.10); }
    .flowTag.party { background: rgba(239,68,68,.10); border-color: rgba(239,68,68,.25); color: #b91c1c; }
    .flowTag.league { background: rgba(37,99,235,.10); border-color: rgba(37,99,235,.25); color: #1d4ed8; }
    .flowTag.nodes { background: rgba(147,51,234,.10); border-color: rgba(147,51,234,.22); color: #7e22ce; }
    .flowTag.active { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.25); color: #166534; }
    .flowActions { display:flex; gap: 10px; align-items:center; justify-content:flex-end; }
    .flowIco { width: 26px; height: 26px; border-radius: 8px; display:grid; place-items:center; border: 1px solid rgba(15,23,42,.10); background: rgba(15,23,42,.03); cursor: pointer; font-weight: 900; }
    .flowIco:hover { background: rgba(37,99,235,.08); border-color: rgba(37,99,235,.25); }
    .flowIco.green { color: #22c55e; }
    .flowIco.purple { color: #a855f7; }
    .flowIco.red { color: #ef4444; }
    .cfgGrid { display:grid; grid-template-columns: 280px 1fr 320px; gap: 14px; align-items: start; }
    .cfgCard { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px; box-shadow: 0 10px 20px rgba(0,0,0,.05); }
    .cfgTitle { font-size: 13px; color: var(--muted); font-weight: 800; margin-bottom: 10px; }
    .cfgList { display:grid; gap: 8px; }
    .cfgItem { padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(15,23,42,.08); background: rgba(15,23,42,.02); cursor: pointer; font-weight: 850; }
    .cfgItem.active { background: rgba(30,91,255,.12); border-color: rgba(30,91,255,.25); color: #1e5bff; }
    .cfgNodesHeader { display:flex; align-items:center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .cfgNodesHeader h3 { margin: 0; font-size: 14px; font-weight: 900; }
    .cfgAddBtn { display:inline-flex; align-items:center; gap: 8px; padding: 8px 12px; border-radius: 10px; border: 0; background: var(--brand); color: #ffffff; cursor: pointer; font-weight: 900; }
    .cfgAddBtn:hover { filter: brightness(1.02); }
    .wfNodeList { display:grid; gap: 12px; }
    .wfNodeCard { position: relative; border-radius: 14px; border: 1px solid rgba(30,91,255,.18); background: linear-gradient(90deg, rgba(30,91,255,.16), rgba(30,91,255,.06)); padding: 14px 14px 14px 12px; display:flex; align-items:flex-start; gap: 12px; }
    .wfNodeNum { width: 34px; height: 34px; border-radius: 999px; background: #1e5bff; color: #ffffff; display:grid; place-items:center; font-weight: 900; }
    .wfNodeMain { flex: 1; display:grid; gap: 6px; }
    .wfNodeName { font-weight: 900; }
    .wfNodeMeta { display:flex; gap: 18px; font-size: 12px; color: var(--muted); }

    .honorActions { display:flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .honorFilters { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .honorStats { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
    .honorStat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .honorStat .k { color: var(--muted); font-size: 12px; font-weight: 800; }
    .honorStat .v { margin-top: 8px; font-size: 24px; font-weight: 950; }
    .honorLayout { display:grid; grid-template-columns: minmax(340px, 430px) minmax(0, 1fr); gap: 14px; align-items:start; }
    .honorShowcaseList { display:grid; gap: 10px; }
    .honorShowcaseCard { border: 1px solid rgba(37,99,235,.18); border-radius: 12px; padding: 12px; background: linear-gradient(135deg, rgba(37,99,235,.13), rgba(255,255,255,.95) 54%, rgba(14,165,233,.08)); cursor: pointer; transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease; }
    .honorShowcaseCard:hover { transform: translateY(-1px); border-color: rgba(37,99,235,.34); box-shadow: 0 10px 24px rgba(37,99,235,.10); }
    .honorShowcaseCard.active { border-color: rgba(37,99,235,.55); box-shadow: 0 12px 30px rgba(37,99,235,.16); }
    .honorBlueBlock { display:inline-flex; align-items:center; max-width: 100%; padding: 8px 10px; border-radius: 8px; background: #2563eb; color: #ffffff; font-size: 13px; font-weight: 900; line-height: 1.35; }
    .honorMeta { display:flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .honorDetailTitle { display:flex; align-items:flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .honorDetailTitle h3 { margin: 0; font-size: 18px; font-weight: 950; }
    .honorRecipientGrid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .honorRecipientCard { border: 1px solid rgba(15,23,42,.10); border-radius: 12px; padding: 12px; background: #ffffff; cursor: pointer; }
    .honorRecipientCard:hover { border-color: rgba(37,99,235,.32); background: rgba(37,99,235,.035); }
    .honorAvatar { width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #14b8a6); color: #fff; display:grid; place-items:center; font-weight: 950; flex: 0 0 auto; }
    .honorRecipientHead { display:flex; gap: 10px; align-items:center; }
    .honorRecipientName { font-weight: 950; }
    .honorRecipientSub { margin-top: 3px; font-size: 12px; color: var(--muted); }
    .honorExcerpt { margin-top: 10px; color: #334155; font-size: 12px; line-height: 1.6; }
    .honorEmpty { padding: 26px; text-align:center; color: var(--muted); border: 1px dashed rgba(15,23,42,.18); border-radius: 12px; background: rgba(255,255,255,.64); }
    .honorPreviewPhoto { width: 100%; max-height: 190px; object-fit: cover; border-radius: 12px; border: 1px solid rgba(15,23,42,.10); background: #f8fafc; }
    .honorImportHelp { font-size: 12px; color: var(--muted); line-height: 1.7; }
    @media (max-width: 1180px) {
      .honorLayout { grid-template-columns: 1fr; }
      .honorRecipientGrid { grid-template-columns: 1fr; }
    }
    @media (max-width: 980px) {
      body { overflow: auto; }
      .header { position: sticky; top: 0; }
      .app { position: static; display: block; }
      .sidebar { position: static; height: auto; }
      .main { height: auto; overflow: visible; }
      .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .menu { width: calc(100vw - 24px); right: 12px; }
      .todoGrid { grid-template-columns: repeat(1, minmax(0, 1fr)); }
      .actionGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .kpiGrid { grid-template-columns: repeat(1, minmax(0, 1fr)); }
      .honorStats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>

  <div class="overlay" id="loginOverlay">
    <div class="login">
      <h2>登录后才能使用管理后台</h2>
      <p>请使用演示账号登录。登录成功后会在浏览器本地保存 token。</p>
      <div class="row">
        <div class="field" style="flex:1; min-width: 240px;">
          <label>用户名</label>
          <input id="loginUsername" placeholder="admin" autocomplete="username" />
        </div>
      </div>
      <div class="row">
        <div class="field" style="flex:1; min-width: 240px;">
          <label>密码</label>
          <input id="loginPassword" type="password" placeholder="123456" autocomplete="current-password" />
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="loginBtn">登录</button>
      </div>
      <div class="toast" id="loginMsg"></div>
    </div>
  </div>

  <div class="overlay" id="userOverlay">
    <div class="modal">
      <div class="modalHeader">
        <div class="modalTitle" id="userModalTitle">用户</div>
      </div>
      <div class="modalBody" id="userModalBody"></div>
      <div class="toast" id="userModalMsg"></div>
      <div class="modalFooter" id="userModalFooter"></div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "ssp_admin_token";
    const USER_KEY = "ssp_admin_user";

    function getToken() {
      return localStorage.getItem(TOKEN_KEY);
    }

    function setToken(token) {
      localStorage.setItem(TOKEN_KEY, token);
      document.cookie = "token=" + encodeURIComponent(token) + "; path=/; SameSite=Lax";
    }

    function clearAuth() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
      document.cookie = "token=; Max-Age=0; path=/; SameSite=Lax";
    }

    function setUser(user) {
      localStorage.setItem(USER_KEY, JSON.stringify(user));
      const profileBtn = document.getElementById("profileBtn");
      const profileBody = document.getElementById("profileBody");
      const displayName = user ? (user.name || user.username) : "未登录";
      profileBtn.textContent = user ? (displayName + " · " + user.role) : "未登录";
      profileBody.innerHTML = "";
      if (!user) {
        const item = document.createElement("div");
        item.className = "menuItem";
        const title = document.createElement("div");
        title.className = "menuItemTitle";
        title.textContent = "未登录";
        const sub = document.createElement("div");
        sub.className = "menuItemSub";
        sub.textContent = "请先登录后再使用管理后台";
        item.appendChild(title);
        item.appendChild(sub);
        profileBody.appendChild(item);
        return;
      }
      const blocks = [
        { title: displayName, sub: "账号：" + (user.username || "-") },
        { title: "角色", sub: user.role || "-" },
        { title: "用户ID", sub: String(user.userId ?? "-") }
      ];
      blocks.forEach(b => {
        const item = document.createElement("div");
        item.className = "menuItem";
        const t = document.createElement("div");
        t.className = "menuItemTitle";
        t.textContent = b.title;
        const s = document.createElement("div");
        s.className = "menuItemSub";
        s.textContent = b.sub;
        item.appendChild(t);
        item.appendChild(s);
        profileBody.appendChild(item);
      });
    }

    function getUser() {
      try {
        return JSON.parse(localStorage.getItem(USER_KEY) || "null");
      } catch (e) {
        return null;
      }
    }

    function showLoginOverlay(message) {
      const overlay = document.getElementById("loginOverlay");
      overlay.classList.add("show");
      const msg = document.getElementById("loginMsg");
      msg.textContent = message || "";
      setUser(null);
    }

    function hideLoginOverlay() {
      document.getElementById("loginOverlay").classList.remove("show");
      document.getElementById("loginMsg").textContent = "";
    }

    function showUserOverlay(title) {
      document.getElementById("userModalTitle").textContent = title || "用户";
      document.getElementById("userModalMsg").textContent = "";
      document.getElementById("userOverlay").classList.add("show");
    }

    function hideUserOverlay() {
      document.getElementById("userOverlay").classList.remove("show");
      document.getElementById("userModalBody").innerHTML = "";
      document.getElementById("userModalFooter").innerHTML = "";
      document.getElementById("userModalMsg").textContent = "";
    }

    function setUserModalContent(bodyNodes, footerNodes) {
      const body = document.getElementById("userModalBody");
      const footer = document.getElementById("userModalFooter");
      body.innerHTML = "";
      footer.innerHTML = "";
      (bodyNodes || []).forEach(n => body.appendChild(n));
      const nodes = (footerNodes || []).filter(Boolean);
      if (!nodes.length) {
        footer.appendChild(el("button", { class: "btn", type: "button", text: "关闭", onclick: () => hideUserOverlay() }));
        return;
      }
      nodes.forEach(n => footer.appendChild(n));
    }

    async function apiFetch(path, options) {
      const token = getToken();
      const headers = Object.assign({ "Accept": "application/json" }, (options && options.headers) || {});
      const hasContentType = Object.keys(headers).some(k => String(k).toLowerCase() === "content-type");
      if (!hasContentType && options && typeof options.body === "string") {
        headers["Content-Type"] = "application/json";
      }
      if (token) {
        headers["Authorization"] = "Bearer " + token;
      }
      const resp = await fetch(path, Object.assign({}, options || {}, { headers }));
      if (resp.status === 401) {
        clearAuth();
        showLoginOverlay("登录已失效，请重新登录");
      }
      return resp;
    }

    async function apiJson(path, options) {
      const resp = await apiFetch(path, options);
      const json = await resp.json().catch(() => null);
      if (!resp.ok) {
        const msg = json && json.message ? json.message : ("请求失败(" + resp.status + ")");
        throw new Error(msg);
      }
      if (!json || !json.success) {
        throw new Error(json && json.message ? json.message : "请求失败");
      }
      return json.data;
    }

    async function apiBlob(path, options) {
      const resp = await apiFetch(path, options);
      if (!resp.ok) {
        let msg = "请求失败(" + resp.status + ")";
        try {
          const json = await resp.json();
          if (json && json.message) msg = json.message;
        } catch (e) {}
        throw new Error(msg);
      }
      return await resp.blob();
    }

    function guessIconActionTitle(text) {
      const t = (text == null ? "" : String(text)).trim();
      if (!t) return null;
      const map = {
        "👁": "查看",
        "✎": "编辑",
        "🗑": "删除",
        "⧉": "复制",
        "📎": "附件",
        "🚀": "发布",
        "↩": "撤回",
        "✅": "启用",
        "⛔": "禁用",
        "🔑": "重置密码",
        "🔓": "解锁"
      };
      return map[t] || null;
    }

    function el(tag, attrs, children) {
      const svgTags = new Set(["svg", "g", "path", "circle", "rect", "line", "polyline", "polygon", "text", "defs", "linearGradient", "stop"]);
      const node = svgTags.has(tag)
        ? document.createElementNS("http://www.w3.org/2000/svg", tag)
        : document.createElement(tag);
      if (attrs) {
        Object.entries(attrs).forEach(([k, v]) => {
          if (k === "class") node.className = v;
          else if (k === "text") node.textContent = v;
          else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.substring(2).toLowerCase(), v);
          else if (k === "disabled") node.disabled = !!v;
          else if (k === "checked") node.checked = !!v;
          else if (k === "selected") node.selected = !!v;
          else if (v == null || v === false) return;
          else node.setAttribute(k, String(v));
        });
      }
      if (children) {
        children.forEach((c) => {
          if (c == null) return;
          if (typeof c === "string") node.appendChild(document.createTextNode(c));
          else node.appendChild(c);
        });
      }
      const tagName = node.tagName ? node.tagName.toLowerCase() : "";
      if ((tagName === "button" || tagName === "a") && !node.getAttribute("title")) {
        const cls = String(node.className || "");
        if (cls.includes("iconAction")) {
          const title = guessIconActionTitle(node.textContent);
          if (title) {
            node.setAttribute("title", title);
          }
        }
      }
      return node;
    }

    function setActiveNav(view) {
      document.querySelectorAll(".nav button[data-view]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === view);
      });
    }

    const NAV_GROUP_KEY = "ssp_nav_groups";

    function loadGroupState() {
      try {
        const raw = localStorage.getItem(NAV_GROUP_KEY);
        if (!raw) return {};
        const obj = JSON.parse(raw);
        if (!obj || typeof obj !== "object") return {};
        return obj;
      } catch (e) {
        return {};
      }
    }

    function saveGroupState(obj) {
      localStorage.setItem(NAV_GROUP_KEY, JSON.stringify(obj || {}));
    }

    function setGroupCollapsed(groupEl, collapsed) {
      const key = groupEl.dataset.group;
      if (!key) return;
      groupEl.classList.toggle("collapsed", !!collapsed);
      const state = loadGroupState();
      state[key] = !!collapsed;
      saveGroupState(state);
    }

    function initNavGroups() {
      const state = loadGroupState();
      document.querySelectorAll(".group[data-group]").forEach(groupEl => {
        const key = groupEl.dataset.group;
        const collapsed = state[key] == null ? true : !!state[key];
        groupEl.classList.toggle("collapsed", collapsed);
        const header = groupEl.querySelector(".groupHeader");
        if (header) {
          header.addEventListener("click", () => {
            setGroupCollapsed(groupEl, !groupEl.classList.contains("collapsed"));
          });
        }
      });
    }

    function ensureGroupVisibleForButton(btn) {
      const groupEl = btn.closest(".group[data-group]");
      if (!groupEl) return;
      if (groupEl.classList.contains("collapsed")) {
        setGroupCollapsed(groupEl, false);
      }
    }

    function hideAllMenus() {
      document.getElementById("notifMenu").classList.remove("show");
      document.getElementById("profileMenu").classList.remove("show");
    }

    async function loadNotifList() {
      const listEl = document.getElementById("notifList");
      listEl.innerHTML = "";
      listEl.appendChild(el("div", { class: "menuItem" }, [el("div", { class: "menuItemTitle", text: "加载中..." })]));
      try {
        const pageData = await apiJson("/api/v1/admin/notices/page?" + buildQuery({ page: 0, size: 5 }));
        const items = pageData && pageData.content ? pageData.content : [];
        const badge = document.getElementById("notifBadge");
        if (items.length > 0) {
          badge.style.display = "inline-flex";
          badge.textContent = String(items.length);
        } else {
          badge.style.display = "none";
        }
        listEl.innerHTML = "";
        if (!items.length) {
          listEl.appendChild(el("div", { class: "menuItem" }, [
            el("div", { class: "menuItemTitle", text: "暂无通知" }),
            el("div", { class: "menuItemSub", text: "你可以到“通知中心”发布一条测试通知" })
          ]));
          return;
        }
        items.forEach(n => {
          const itemEl = el("div", { class: "menuItem" }, [
            el("div", { class: "menuItemTitle", text: n.title || "-" }),
            el("div", { class: "menuItemSub", text: (n.publishTime || "-") + " · " + (n.targetDescription || "-") })
          ]);
          itemEl.addEventListener("click", async () => {
            hideAllMenus();
            await switchView("notices");
          });
          listEl.appendChild(itemEl);
        });
      } catch (e) {
        listEl.innerHTML = "";
        listEl.appendChild(el("div", { class: "menuItem" }, [
          el("div", { class: "menuItemTitle", text: "加载失败" }),
          el("div", { class: "menuItemSub", text: e.message })
        ]));
      }
    }

    async function ensureLoggedIn() {
      const token = getToken();
      if (!token) {
        showLoginOverlay("");
        return false;
      }
      const user = getUser();
      try {
        if (!user || !user.name) {
          const profile = await apiJson("/api/v1/auth/me");
          setUser({ userId: profile.userId, username: profile.username, role: profile.role, name: profile.name });
        } else {
          setUser(user);
        }
      } catch (e) {
        clearAuth();
        showLoginOverlay("请登录后继续");
        return false;
      }
      hideLoginOverlay();
      return true;
    }

    async function doLogin(username, password) {
      const resp = await fetch("/api/v1/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const json = await resp.json().catch(() => null);
      if (!resp.ok || !json || !json.success) {
        throw new Error((json && json.message) ? json.message : ("登录失败(" + resp.status + ")"));
      }
      setToken(json.data.token);
      setUser({ userId: json.data.userId, username: json.data.username, role: json.data.role, name: json.data.username });
      hideLoginOverlay();
    }

    function normalizeUrl(value) {
      const s = (value || "").trim();
      if (!s) return null;
      return s;
    }

    function normalizeText(value) {
      const s = (value || "").trim();
      return s ? s : null;
    }

    function normalizeBool(value) {
      if (value === true || value === false) return value;
      if (value == null) return null;
      const s = String(value).trim().toLowerCase();
      if (s === "true") return true;
      if (s === "false") return false;
      return null;
    }

    function buildQuery(params) {
      const qs = new URLSearchParams();
      Object.entries(params || {}).forEach(([k, v]) => {
        if (v == null) return;
        if (typeof v === "string" && v.trim() === "") return;
        qs.set(k, String(v));
      });
      return qs.toString();
    }

    const KNOWLEDGE_CONTENT_KEY = "ssp_knowledge_contents";

    function loadKnowledgeContentMap() {
      try {
        const raw = localStorage.getItem(KNOWLEDGE_CONTENT_KEY);
        if (!raw) return {};
        const obj = JSON.parse(raw);

        if (!value) return null;

      function isSameDay(a, b) {
        return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
      }

      function formatActivityTime(value) {
        const d = parseDate(value);
        if (!d) return "-";
        const nowDate = new Date();
        const yest = new Date(nowDate);
        yest.setDate(nowDate.getDate() - 1);
        if (isSameDay(d, nowDate)) {
          return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
        }
        if (isSameDay(d, yest)) return "昨天";
        return String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }

      function calcWindowCounts(filterFn) {
        const nowDate = new Date();
        const w1Start = new Date(nowDate);
        w1Start.setDate(nowDate.getDate() - 7);
        const w0Start = new Date(nowDate);
        w0Start.setDate(nowDate.getDate() - 14);

        logs.forEach(l => {

          if (filterFn(l)) {

          }
        });
        return { cur, prev };
      }

      function deltaText(cur, prev) {
        if (!prev && !cur) return { text: "0%", cls: "zero" };
        if (!prev && cur) return { text: "+100%", cls: "pos" };
        const pct = Math.round(((cur - prev) / prev) * 100);
        if (pct > 0) return { text: "+" + pct + "%", cls: "pos" };
        if (pct < 0) return { text: pct + "%", cls: "neg" };
        return { text: "0%", cls: "zero" };

    function downloadOperationLogsCsv(rows) {
      const items = Array.isArray(rows) ? rows : [];
      if (!items.length) return;
      const headers = ["时间", "模块", "业务类型", "操作人", "结果", "级别", "IP地址", "请求路径", "TRACE ID", "详情"];
      const lines = [headers.join(",")];
      items.forEach(item => {
        const row = [
          formatDateTimeText(item.operatedAt),
          opModuleLabel(item.module),
          opBusinessLabel(item.action, item.detail, item.target),
          item.operatorName || "-",
          String(item.result || "-"),
          String(item.logLevel || "-"),
          item.requestIp || "-",
          item.requestUri || "-",
          item.traceId || "-",
          item.detail || "-"
        ].map(v => {
          const s = String(v == null ? "" : v).replaceAll("\"", "\"\"");
          return "\"" + s + "\"";
        });
        lines.push(row.join(","));
      });
      const csv = "\uFEFF" + lines.join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "operation-logs.csv";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

      async function loadPolicyDetail(policy) {
        detailPanel.innerHTML = "";
        let adminDetail = null;
        try {
          adminDetail = await apiJson("/api/v1/admin/knowledge/" + policy.id + "/detail");
          if (adminDetail && adminDetail.content) {
            saveKnowledgeContent(policy.id, String(adminDetail.content));
          }
        } catch (e) {}
        
        async function togglePublish(nextPublished) {
          const user = getUser();
          const updatedBy = user ? (user.name || user.username) : "系统管理员";
          let contentText = getKnowledgeContent(policy.id);
          if (!contentText && adminDetail && adminDetail.content) {
            contentText = String(adminDetail.content);
          }
          contentText = (contentText || "").trim();
          if (!contentText) {
            toast.textContent = "未找到政策正文内容，无法发布/撤回";
            return;
          }
          const body = {
            title: (policy.title || "").trim(),
            category: (policy.category || "政策管理").trim(),
            summary: normalizeText(adminDetail && adminDetail.summary ? String(adminDetail.summary) : ""),
            content: contentText,
            officialUrl: normalizeUrl(policy.officialUrl),
            sourceFileName: normalizeText(policy.sourceFileName),
            audienceScope: normalizeText(policy.audienceScope),
            updatedBy: updatedBy,
            published: !!nextPublished
          };
          Object.keys(body).forEach(k => { if (body[k] == null) delete body[k]; });
          await apiJson("/api/v1/admin/knowledge/" + policy.id, { method: "PUT", body: JSON.stringify(body) });
          const updated = Object.assign({}, policy, { published: !!nextPublished, updatedBy: updatedBy });
          allPolicies = (allPolicies || []).map(x => String(x.id) === String(policy.id) ? updated : x);
          await loadPoliciesList();
          await loadPolicyDetail(updated);
        }

    function parseTags(input) {
      const raw = (input || "").split(",").map(s => s.trim()).filter(Boolean);
      return raw.length ? raw : null;
    }

    function getNoticeSource(tags) {
      const arr = Array.isArray(tags) ? tags : [];
      const hit = arr.find(t => String(t || "").startsWith("来源:"));
      if (!hit) return null;
      const v = String(hit).slice(3).trim();
      return v || null;
    }

    function getNoticePublisher(tags) {
      const arr = Array.isArray(tags) ? tags : [];
      const hit = arr.find(t => String(t || "").startsWith("发布人:"));
      if (!hit) return { name: null, username: null };
      const v = String(hit).slice(4).trim();
      if (!v) return { name: null, username: null };
      const parts = v.split("|");
      return {
        name: (parts[0] || "").trim() || null,
        username: (parts[1] || "").trim() || null
      };
    }

    function withNoticeSource(tags, source) {
      const arr = Array.isArray(tags) ? tags.slice() : [];
      const filtered = arr.filter(t => !String(t || "").startsWith("来源:"));
      const s = String(source || "").trim();
      if (!s) return filtered;
      filtered.unshift("来源:" + s);
      return filtered;
    }

    function withNoticePublisher(tags, user) {
      const arr = Array.isArray(tags) ? tags.slice() : [];
      const filtered = arr.filter(t => !String(t || "").startsWith("发布人:"));
      const u = user || getUser() || null;
      if (!u) return filtered;
      const displayName = (u.name || u.username || "").trim();
      const username = (u.username || "").trim();
      if (!displayName && !username) return filtered;
      filtered.unshift("发布人:" + (displayName || username) + "|" + username);
      return filtered;
    }

    async function loadApprovals(state) {
      document.getElementById("pageTitle").textContent = "审批任务";
      const content = document.getElementById("content");
      content.innerHTML = "";

      const s = Object.assign({ tab: "TODO", certificateType: "" }, state || {});

      const header = el("div", { class: "pageHeader" }, [
        el("div", null, [
          el("h2", { text: "审批任务" }),
          el("div", { class: "desc", text: "处理具体审批任务" })
        ])
      ]);
      content.appendChild(header);

      const toast = el("div", { class: "toast" }, []);
      const board = el("div", { class: "approvalBoard" }, []);
      content.appendChild(board);
      content.appendChild(toast);

      function parseDt(value) {
        if (!value) return null;
        const d = new Date(value);
        if (!Number.isNaN(d.getTime())) return d;
        const fixed = String(value).replace(" ", "T");
        const d2 = new Date(fixed);
        if (!Number.isNaN(d2.getTime())) return d2;
        return null;
      }

      function slaFor(item) {
        const dt = parseDt(item.submittedAt);
        if (!dt) return { cls: "ok", text: "正常", overdue: false };
        const hours = (Date.now() - dt.getTime()) / 3600000;
        if (hours >= 48) return { cls: "bad", text: "已超时", overdue: true };
        if (hours >= 36) return { cls: "warn", text: "即将超时", overdue: false };
        return { cls: "ok", text: "正常", overdue: false };
      }

      function isTodoStatus(status) {
        const u = String(status || "").toUpperCase();
        return u === "PENDING" || u === "COUNSELOR_APPROVED";
      }

      function isDoneStatus(status) {
        const u = String(status || "").toUpperCase();
        return u === "APPROVED" || u === "REJECTED" || u === "WITHDRAWN";
      }

      let loading = false;
      let tasks = [];
      let typeOptions = [];

      const tabs = el("div", { class: "tabs" }, []);
      const tabTodo = el("button", { class: "tabBtn" + (s.tab === "TODO" ? " active" : ""), type: "button", text: "我的待办" });
      const tabDone = el("button", { class: "tabBtn" + (s.tab === "DONE" ? " active" : ""), type: "button", text: "我处理过的" });
      const tabTimeout = el("button", { class: "tabBtn" + (s.tab === "TIMEOUT" ? " active" : ""), type: "button", text: "已超时" });
      tabs.appendChild(tabTodo);
      tabs.appendChild(tabDone);
      tabs.appendChild(tabTimeout);

      const typeSelect = el("select", null, [el("option", { value: "", text: "全部类型" })]);
      typeSelect.value = s.certificateType || "";
      const bulkBtn = el("button", { class: "approvalBulkBtn", type: "button" }, [
        el("span", { text: "✅" }),
        el("span", { text: "一键全选通过" })
      ]);

      const listWrap = el("div", { class: "approvalCards" }, []);

      board.appendChild(el("div", { class: "approvalTop" }, [tabs]));
      board.appendChild(el("div", { class: "approvalFilterRow" }, [
        el("div", { style: "min-width: 160px;" }, [typeSelect]),
        bulkBtn,
        el("button", { class: "approvalBulkBtn", type: "button", onclick: async () => {
          toast.textContent = "";
          try {
            const raw = prompt("生成多少条模拟审批任务？（1-20）", "3");
            if (raw == null) return;
            const count = Math.max(1, Math.min(20, parseInt(raw, 10) || 3));
            await apiJson("/api/v1/admin/approvals/seed?count=" + count, { method: "POST" });
            await reload();
          } catch (e) {
            toast.textContent = e.message;
          }
        }}, [el("span", { text: "➕" }), el("span", { text: "生成模拟任务" })])
      ]));
      board.appendChild(listWrap);

      function setTab(next) {
        s.tab = next;
        tabTodo.classList.toggle("active", next === "TODO");
        tabDone.classList.toggle("active", next === "DONE");
        tabTimeout.classList.toggle("active", next === "TIMEOUT");
        render();
      }

      tabTodo.addEventListener("click", () => setTab("TODO"));
      tabDone.addEventListener("click", () => setTab("DONE"));
      tabTimeout.addEventListener("click", () => setTab("TIMEOUT"));

      typeSelect.addEventListener("change", () => {
        s.certificateType = typeSelect.value;
        render();
      });

      async function onAction(item, action) {
        toast.textContent = "";
        let comment = "";
        if (action === "approve") {
          const raw = prompt("通过备注（可空）", "");
          if (raw == null) return null;
          comment = raw || "";
        } else if (action === "reject") {
          const raw = prompt("驳回原因（可空）", "");
          if (raw == null) return null;
          comment = raw || "";
        } else if (action === "resubmit") {
          if (!confirm("确认将该任务重新提交为待审批？")) return null;
          comment = "";
        }
        const first = await apiJson("/api/v1/admin/approvals/" + item.requestId + "/action", {
          method: "POST",
          body: JSON.stringify({ action: action, comment: comment })
        });
        if (action === "approve") {
          const me = getUser();
          const role = me && me.role ? String(me.role).toUpperCase() : "";
          const canFinalApprove = role === "SUPER_ADMIN" || role === "COLLEGE_ADMIN";
          if (canFinalApprove && first && isTodoStatus(first.status)) {
            await apiJson("/api/v1/admin/approvals/" + item.requestId + "/action", {
              method: "POST",
              body: JSON.stringify({ action: action, comment: "" })
            });
          }
        }
        return true;
      }

        if (!filtered.length) {
          listWrap.appendChild(el("div", { style: "color:#94a3b8; padding: 18px 6px; text-align:center;" }, [
            el("div", { text: "暂无审批任务" })
          ]));
          return;
        }

        filtered.forEach(item => {
          let sla = slaFor(item);
          if (isDoneStatus(item.status)) {
            sla = { cls: "ok", text: "已处理", overdue: false };
          }
          const card = el("div", { class: "approvalCard" + (sla.overdue && isTodoStatus(item.status) ? " overdue" : "") }, []);
          const left = el("div", null, []);
          const titleRow = el("div", { class: "approvalTitleRow" }, [
            el("div", { class: "approvalTitle", text: item.certificateType || "审批任务" }),
            approvalStatusTag(item.status),
            el("span", { class: "slaPill " + sla.cls }, [
              el("span", { text: sla.cls === "ok" ? "✓" : (sla.cls === "warn" ? "⏱" : "⛔") }),
              el("span", { text: "SLA状态：" + sla.text })
            ])
          ]);
          const meta = el("div", { class: "approvalMeta" }, [
            el("div", { text: "申请人：" + (item.studentName || "-") }),
            el("div", { text: "提交时间：" + formatDateTimeText(item.submittedAt) })
          ]);
          left.appendChild(titleRow);
          left.appendChild(meta);

          const disabledOperator = isDoneStatus(item.status);
          const btnApprove = el("button", { class: "approvalBtn green", type: "button", disabled: disabledOperator || loading }, [
            el("span", { text: "✅" }),
            el("span", { text: "通过" })
          ]);
          const btnReject = el("button", { class: "approvalBtn red", type: "button", disabled: disabledOperator || loading }, [
            el("span", { text: "⛔" }),
            el("span", { text: "驳回" })
          ]);
          const canResubmit = String(item.status || "").toUpperCase() === "REJECTED" || String(item.status || "").toUpperCase() === "WITHDRAWN";
          const btnResubmit = el("button", { class: "approvalBtn", type: "button", disabled: loading || !canResubmit }, [
            el("span", { text: "↺" }),
            el("span", { text: "重新提交" })
          ]);
          const btnAssign = el("button", { class: "approvalBtn blue", type: "button", disabled: loading }, [
            el("span", { text: "✈" }),
            el("span", { text: "转派" })
          ]);
          const btnFlow = el("button", { class: "approvalBtn", type: "button", disabled: loading }, [
            el("span", { text: "⛓" }),
            el("span", { text: "流程" })
          ]);

          btnApprove.addEventListener("click", async () => {
            loading = true;
            render();
            try {
              const ok = await onAction(item, "approve");
              if (!ok) return;
              await reload();
            } catch (e) {
              toast.textContent = e.message;
            } finally {
              loading = false;
              render();
            }
          });
          btnReject.addEventListener("click", async () => {
            loading = true;
            render();
            try {
              const ok = await onAction(item, "reject");
              if (!ok) return;
              await reload();
            } catch (e) {
              toast.textContent = e.message;
            } finally {
              loading = false;
              render();
            }
          });
          btnResubmit.addEventListener("click", async () => {
            loading = true;
            render();
            try {
              const ok = await onAction(item, "resubmit");
              if (!ok) return;
              await reload();
            } catch (e) {
              toast.textContent = e.message;
            } finally {
              loading = false;
              render();
            }
          });
          btnAssign.addEventListener("click", async () => {
            await openAssignDialog(item);
          });
          btnFlow.addEventListener("click", async () => {
            await openWorkflowDialog(item);
          });

          const right = el("div", { class: "approvalBtns" }, s.tab === "DONE" ? [btnResubmit, btnAssign, btnFlow] : [btnApprove, btnReject, btnAssign, btnFlow]);
          card.appendChild(left);
          card.appendChild(right);
          listWrap.appendChild(card);
        });
      }

      bulkBtn.addEventListener("click", async () => {
        if (loading) return;
        const filtered = tasks
          .filter(t => !s.certificateType || String(t.certificateType || "") === String(s.certificateType))
          .filter(t => isTodoStatus(t.status));
        if (!filtered.length) return;
        if (!confirm("确认对当前列表 " + filtered.length + " 条任务执行通过吗？")) return;
        loading = true;
        render();
        try {
          const me = getUser();
          const role = me && me.role ? String(me.role).toUpperCase() : "";
          const canFinalApprove = role === "SUPER_ADMIN" || role === "COLLEGE_ADMIN";
          let okCount = 0;
          let failCount = 0;
          for (const item of filtered) {
            try {
              const first = await apiJson("/api/v1/admin/approvals/" + item.requestId + "/action", {
                method: "POST",
                body: JSON.stringify({ action: "approve", comment: "" })
              });
              okCount += 1;
              if (canFinalApprove && first && isTodoStatus(first.status)) {
                await apiJson("/api/v1/admin/approvals/" + item.requestId + "/action", {
                  method: "POST",
                  body: JSON.stringify({ action: "approve", comment: "" })
                });
              }
            } catch (e) {
              failCount += 1;
            }
          }
          if (failCount) {
            toast.textContent = "批量处理完成：成功 " + okCount + " 条，失败 " + failCount + " 条（可能是权限/状态限制）";
          }
          await reload();
        } catch (e) {
          toast.textContent = e.message;
        } finally {
          loading = false;
          render();
        }
      });

      async function reload() {
        toast.textContent = "";
        try {
          const pageData = await apiJson("/api/v1/admin/approvals/page?" + buildQuery({ page: 0, size: 50 }));
          tasks = (pageData && pageData.content) ? pageData.content : [];
        } catch (e) {
          toast.textContent = e.message;
          tasks = [];
        }
        render();
      }

      await reload();
    }

    async function loadCertTemplates(state) {
      document.getElementById("pageTitle").textContent = "证明模板";
      const content = document.getElementById("content");
      content.innerHTML = "";

      const STORAGE_KEY = "ssp_cert_templates_demo";
      const REMOTE_KEY = "ssp_cert_templates_remote";

      function tryParseJson(raw, fallback) {
        try {
          const obj = JSON.parse(raw);
          return obj == null ? fallback : obj;
        } catch (e) {
          return fallback;
        }
      }

      function loadLocal() {
        const raw = localStorage.getItem(STORAGE_KEY);
        const list = tryParseJson(raw, null);
        if (Array.isArray(list) && list.length) return list;
        return [
          { id: null, code: "CERT_001", name: "在读证明", format: "PDF", active: true, keywords: "在读,证明,学籍", fileId: null, fileName: "" },
          { id: null, code: "CERT_002", name: "成绩单", format: "PDF", active: true, keywords: "成绩,学业", fileId: null, fileName: "" },
          { id: null, code: "CERT_003", name: "实习证明", format: "DOCX", active: false, keywords: "实习,证明", fileId: null, fileName: "" }
        ];
      }

      function saveLocal(list) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list || []));
      }

      function saveRemoteCache(list) {
        localStorage.setItem(REMOTE_KEY, JSON.stringify(list || []));
      }

      function loadRemoteCache() {
        const raw = localStorage.getItem(REMOTE_KEY);
        const list = tryParseJson(raw, null);
        return Array.isArray(list) ? list : null;
      }

      function svgIcon(type) {
        const common = { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round" };
        if (type === "plus") {
          return el("svg", Object.assign({ width: "14", height: "14" }, common), [
            el("line", { x1: "12", y1: "5", x2: "12", y2: "19" }),
            el("line", { x1: "5", y1: "12", x2: "19", y2: "12" })
          ]);
        }
        if (type === "eye") {
          return el("svg", common, [
            el("path", { d: "M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" }),
            el("circle", { cx: "12", cy: "12", r: "3" })
          ]);
        }
        if (type === "edit") {
          return el("svg", common, [
            el("path", { d: "M12 20h9" }),
            el("path", { d: "M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" })
          ]);
        }
        if (type === "copy") {
          return el("svg", common, [
            el("rect", { x: "9", y: "9", width: "13", height: "13", rx: "2", ry: "2" }),
            el("path", { d: "M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" })
          ]);
        }
        if (type === "upload") {
          return el("svg", common, [
            el("path", { d: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" }),
            el("polyline", { points: "17 8 12 3 7 8" }),
            el("line", { x1: "12", y1: "3", x2: "12", y2: "15" })
          ]);
        }
        if (type === "trash") {
          return el("svg", common, [
            el("polyline", { points: "3 6 5 6 21 6" }),
            el("path", { d: "M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" }),
            el("path", { d: "M10 11v6" }),
            el("path", { d: "M14 11v6" }),
            el("path", { d: "M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" })
          ]);
        }
        return el("svg", common, []);
      }

      function formatPill(text) {
        return el("span", { class: "certPill purple", text: text || "-" });
      }

      function statusPill(active) {
        return el("span", { class: "certPill " + (active ? "green" : "gray"), text: active ? "启用" : "停用" });
      }

      function normalizeFormatByFileName(fileName, fallbackFormat) {
        const n = String(fileName || "").trim().toLowerCase();
        if (n.endsWith(".pdf")) return "PDF";
        if (n.endsWith(".docx") || n.endsWith(".doc")) return "DOCX";
        return fallbackFormat || "PDF";
      }

      let items = [];
      let remoteOk = false;
      let lastRemoteErr = null;

      const header = el("div", { class: "pageHeader" }, [
        el("div", null, [
          el("h2", { text: "证明模板" }),
          el("div", { class: "desc", text: "管理各类证明模板" })
        ]),
        el("div", { class: "actions" }, [
          el("button", { class: "flowBtn", type: "button" }, [svgIcon("plus"), el("span", { text: "新建模板" })])
        ])
      ]);

      const card = el("div", { class: "card certTableCard" }, []);
      const toast = el("div", { class: "toast" }, []);
      content.appendChild(header);
      content.appendChild(card);
      content.appendChild(toast);

      let uploadingId = null;
      const fileInput = el("input", { type: "file", accept: ".pdf,.doc,.docx", style: "display:none;" });
      content.appendChild(fileInput);

      fileInput.addEventListener("change", async () => {
        toast.textContent = "";
        const f = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
        if (!f || uploadingId == null) return;
        const idx = items.findIndex(x => String(x.id ?? "") === String(uploadingId) || String(x.code ?? "") === String(uploadingId));
        if (idx < 0) {
          uploadingId = null;
          fileInput.value = "";
          return;
        }
        try {
          const form = new FormData();
          form.append("bizType", "CERT_TEMPLATE");
          if (items[idx].id != null) {
            form.append("bizId", String(items[idx].id));
          }
          form.append("file", f);
          const uploaded = await apiJson("/api/v1/platform/files/upload", { method: "POST", body: form });
          const fileId = uploaded && uploaded.id != null ? uploaded.id : null;
          if (!fileId) throw new Error("上传失败：未返回文件ID");
          const next = Object.assign({}, items[idx], {
            fileId: fileId,
            fileName: uploaded.fileName || f.name || "",
            format: normalizeFormatByFileName(uploaded.fileName || f.name || "", items[idx].format)
          });
          if (remoteOk && items[idx].id != null) {
            await apiJson("/api/v1/admin/cert-templates/" + items[idx].id, {
              method: "PUT",
              body: JSON.stringify({
                templateCode: next.code,
                templateName: next.name,
                outputFormat: next.format,
                keywords: next.keywords || "",
                fileId: next.fileId,
                active: !!next.active
              })
            });
            toast.textContent = "已上传并绑定文件：" + (next.fileName || "-");
            await refresh();
          } else {
            items[idx] = next;
            saveLocal(items);
            render();
            toast.textContent = "已上传文件并绑定到本地模板：" + (next.fileName || "-");
          }
        } catch (e) {
          toast.textContent = e.message;
        }
        uploadingId = null;
        fileInput.value = "";
      });

      function openFormModal(mode, item) {
        const isEdit = mode === "edit";
        const isCreate = mode === "create";
        const isCopy = mode === "copy";

        const codeInput = el("input", { value: item ? (item.code || "") : "" });
        const nameInput = el("input", { value: item ? (item.name || "") : "" });
        const keywordInput = el("input", { value: item ? (item.keywords || "") : "" });
        const formatSelect = el("select", null, [
          el("option", { value: "PDF", text: "PDF" }),
          el("option", { value: "DOCX", text: "DOCX" })
        ]);
        formatSelect.value = item ? (item.format || "PDF") : "PDF";
        const statusSelect = el("select", null, [
          el("option", { value: "1", text: "启用" }),
          el("option", { value: "0", text: "停用" })
        ]);
        statusSelect.value = item && item.active === false ? "0" : "1";

        let fileId = item ? item.fileId : null;
        let fileName = item ? item.fileName : "";
        const fileRow = el("div", { style: "display:flex; gap: 10px; align-items:center; flex-wrap: wrap;" }, [
          el("div", { class: "mono", text: fileName ? ("已绑定：" + fileName) : "未绑定文件" }),
          el("button", { class: "btn", type: "button", text: "上传/更换文件" })
        ]);
        const modalFileInput = el("input", { type: "file", accept: ".pdf,.doc,.docx", style: "display:none;" });
        fileRow.querySelector("button").addEventListener("click", () => modalFileInput.click());
        modalFileInput.addEventListener("change", async () => {
          document.getElementById("userModalMsg").textContent = "";
          const f = modalFileInput.files && modalFileInput.files[0] ? modalFileInput.files[0] : null;
          if (!f) return;
          try {
            const form = new FormData();
            form.append("bizType", "CERT_TEMPLATE");
            form.append("file", f);
            const uploaded = await apiJson("/api/v1/platform/files/upload", { method: "POST", body: form });
            const nextId = uploaded && uploaded.id != null ? uploaded.id : null;
            if (!nextId) throw new Error("上传失败：未返回文件ID");
            fileId = nextId;
            fileName = uploaded.fileName || f.name || "";
            formatSelect.value = normalizeFormatByFileName(fileName, formatSelect.value);
            fileRow.querySelector(".mono").textContent = "已绑定：" + (fileName || "-");
          } catch (e) {
            document.getElementById("userModalMsg").textContent = e.message;
          } finally {
            modalFileInput.value = "";
          }
        });

        if (isCopy) {
          const base = String(item && item.code ? item.code : "CERT_");
          let next = base + "_COPY";
          let n = 2;
          while (items.some(x => String(x.code) === String(next))) {
            next = base + "_COPY" + n;
            n += 1;
          }
          codeInput.value = next;
          nameInput.value = (item && item.name ? String(item.name) : "") + "（复制）";
          fileId = item ? item.fileId : null;
          fileName = item ? item.fileName : "";
        }

        const body = el("div", { class: "cfgForm" }, [
          el("div", null, [el("div", { class: "cfgLabel", text: "模板编码" }), codeInput]),
          el("div", null, [el("div", { class: "cfgLabel", text: "模板名称" }), nameInput]),
          el("div", null, [el("div", { class: "cfgLabel", text: "输出格式" }), formatSelect]),
          el("div", null, [el("div", { class: "cfgLabel", text: "状态" }), statusSelect]),
          el("div", null, [el("div", { class: "cfgLabel", text: "关键词" }), keywordInput]),
          el("div", null, [el("div", { class: "cfgLabel", text: "模板文件" }), fileRow, modalFileInput])
        ]);

        const saveBtn = el("button", { class: "btn primary", text: "保存", type: "button" });
        saveBtn.addEventListener("click", async () => {
          document.getElementById("userModalMsg").textContent = "";
          const code = codeInput.value.trim();
          const name = nameInput.value.trim();
          const keywords = keywordInput.value.trim();
          const format = formatSelect.value;
          const active = statusSelect.value === "1";

          if (!code) {
            document.getElementById("userModalMsg").textContent = "请填写模板编码";
            return;
          }
          if (!name) {
            document.getElementById("userModalMsg").textContent = "请填写模板名称";
            return;
          }
          if (!fileId) {
            document.getElementById("userModalMsg").textContent = "请先上传模板文件";
            return;
          }

          try {
            if (remoteOk) {
              if (isEdit) {
                await apiJson("/api/v1/admin/cert-templates/" + item.id, {
                  method: "PUT",
                  body: JSON.stringify({ templateCode: code, templateName: name, outputFormat: format, keywords, fileId, active })
                });
              } else {
                await apiJson("/api/v1/admin/cert-templates", {
                  method: "POST",
                  body: JSON.stringify({ templateCode: code, templateName: name, outputFormat: format, keywords, fileId, active })
                });
              }
              hideUserOverlay();
              await refresh();
              return;
            }
            const exists = items.some(x => String(x.code) === String(code) && (!isEdit || String(item.code) !== String(code)));
            if (exists) {
              document.getElementById("userModalMsg").textContent = "模板编码已存在";
              return;
            }
            if (isEdit) {
              const idx = items.findIndex(x => String(x.code) === String(item.code));
              if (idx >= 0) {
                items[idx] = Object.assign({}, items[idx], { code, name, keywords, format, active, fileId, fileName });
              }
            } else if (isCreate || isCopy) {
              items = [{ id: null, code, name, keywords, format, active, fileId, fileName }].concat(items);
            }
            saveLocal(items);
            hideUserOverlay();
            render();
          } catch (e) {
            document.getElementById("userModalMsg").textContent = e.message;
          }
        });

        showUserOverlay(isEdit ? "编辑模板" : (isCopy ? "复制模板" : "新建模板"));
        setUserModalContent([body], [saveBtn, el("button", { class: "btn", text: "取消", type: "button", onclick: () => hideUserOverlay() })]);
      }

      function openViewModal(item) {
        const rows = [
          ["模板编码", item.code || "-"],
          ["模板名称", item.name || "-"],
          ["输出格式", item.format || "-"],
          ["状态", item.active ? "启用" : "停用"],
          ["关键词", item.keywords || "-"],
          ["绑定文件", item.fileName || "未选择"]
        ];
        const body = el("div", { style: "display:grid; gap: 10px;" }, rows.map(([k, v]) => {
          return el("div", { style: "display:flex; gap: 10px; align-items:flex-start;" }, [
            el("div", { style: "min-width: 86px; color:#64748b; font-size: 12px; font-weight: 800;", text: k }),
            el("div", { style: "flex:1; font-weight: 750;", text: v })
          ]);
        }));
        showUserOverlay("查看模板");
        setUserModalContent([body], [el("button", { class: "btn", text: "关闭", type: "button", onclick: () => hideUserOverlay() })]);
      }

      function mapRemoteToLocal(item) {
        return {
          id: item.id,
          code: item.templateCode,
          name: item.templateName,
          format: (item.outputFormat || "PDF").toUpperCase(),
          active: !!item.active,
          keywords: item.keywords || "",
          fileId: item.fileId || null,
          fileName: item.fileName || ""
        };
      }

      async function refresh() {
        toast.textContent = "";
        if (remoteOk) {
          try {
            const list = await apiJson("/api/v1/admin/cert-templates");
            items = Array.isArray(list) ? list.map(mapRemoteToLocal) : [];
            saveRemoteCache(items);
            render();
            return;
          } catch (e) {
            toast.textContent = e.message;
          }
        }
        render();
      }

      function render() {
        toast.textContent = "";
        card.innerHTML = "";

        const table = el("table", { class: "certTable" }, []);
        table.appendChild(el("thead", null, [el("tr", null, [
          el("th", { text: "模板编码" }),
          el("th", { text: "模板名称" }),
          el("th", { text: "输出格式" }),
          el("th", { text: "状态" }),
          el("th", { text: "关键词" }),
          el("th", { text: "操作", style: "text-align:right;" })
        ])]));

        const tbody = el("tbody", null, []);
        items.forEach(item => {
          const viewBtn = el("button", { class: "certIconBtn blue", type: "button", title: "查看" }, [svgIcon("eye")]);
          const editBtn = el("button", { class: "certIconBtn green", type: "button", title: "编辑" }, [svgIcon("edit")]);
          const copyBtn = el("button", { class: "certIconBtn purple", type: "button", title: "复制" }, [svgIcon("copy")]);
          const uploadBtn = el("button", { class: "certIconBtn orange", type: "button", title: "绑定文件" }, [svgIcon("upload")]);
          const delBtn = el("button", { class: "certIconBtn red", type: "button", title: "删除" }, [svgIcon("trash")]);

          viewBtn.addEventListener("click", () => openViewModal(item));
          editBtn.addEventListener("click", () => openFormModal("edit", item));
          copyBtn.addEventListener("click", async () => {
            toast.textContent = "";
            if (remoteOk && item.id != null) {
              try {
                await apiJson("/api/v1/admin/cert-templates/" + item.id + "/copy", { method: "POST" });
                await refresh();
              } catch (e) {
                toast.textContent = e.message;
              }
              return;
            }
            openFormModal("copy", item);
          });
          uploadBtn.addEventListener("click", () => {
            if (remoteOk && item.id != null) {
              uploadingId = item.id;
            } else {
              uploadingId = item.code;
              toast.textContent = lastRemoteErr ? ("后端模板接口不可用：" + lastRemoteErr + "（将先绑定到本地模板）") : "将先绑定到本地模板";
            }
            fileInput.click();
          });
          delBtn.addEventListener("click", async () => {
            toast.textContent = "";
            if (!confirm("确认删除模板 " + (item.name || item.code) + " 吗？")) return;
            if (remoteOk && item.id != null) {
              try {
                await apiJson("/api/v1/admin/cert-templates/" + item.id, { method: "DELETE" });
                await refresh();
              } catch (e) {
                toast.textContent = e.message;
              }
              return;
            }
            items = items.filter(x => String(x.code) !== String(item.code));
            saveLocal(items);
            render();
          });

          tbody.appendChild(el("tr", null, [
            el("td", null, [el("div", { class: "mono", text: item.code || "-" })]),
            el("td", null, [el("div", { text: item.name || "-" })]),
            el("td", null, [formatPill(item.format || "-")]),

    function formatDateYmd(value) {
      if (!value) return "-";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }

    function flowTypeLabel(type) {
      const t = String(type || "").toLowerCase();
      if (t === "party" || t === "党组织") return { text: "党组织", cls: "party" };
      if (t === "league" || t === "团组织") return { text: "团组织", cls: "league" };
      return { text: type || "-", cls: "league" };
    }

    function formatDayText(n) {

      if (Number.isNaN(v)) return "-";
      return String(v) + "天";
