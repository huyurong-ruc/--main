    function svgLineChart(points, width, height) {
      const w = width || 900;
      const h = height || 260;
      const padL = 46;
      const padR = 16;
      const padT = 18;
      const padB = 34;
      const maxY = Math.max(0, ...points.map(p => p.y));
      const minY = 0;
      const yTicks = 4;
      const innerW = w - padL - padR;
      const innerH = h - padT - padB;

      function x(i) {
        if (points.length <= 1) return padL;
        return padL + (innerW * i) / (points.length - 1);
      }
      function y(v) {
        const denom = (maxY - minY) || 1;
        return padT + innerH * (1 - (v - minY) / denom);
      }

      const svg = el("svg", { width: "100%", height: String(h), viewBox: "0 0 " + w + " " + h }, []);

      for (let t = 0; t <= yTicks; t += 1) {
        const v = Math.round((maxY * t) / yTicks);
        const yy = y(v);
        svg.appendChild(el("line", { x1: String(padL), y1: String(yy), x2: String(w - padR), y2: String(yy), stroke: "rgba(15,23,42,.08)" }));
        svg.appendChild(el("text", { x: String(10), y: String(yy + 4), fill: "#9ca3af", "font-size": "12" }, [String(v)]));
      }

      const pts = points.map((p, i) => x(i) + "," + y(p.y)).join(" ");
      svg.appendChild(el("polyline", { points: pts, fill: "none", stroke: "#1e5bff", "stroke-width": "2" }));
      points.forEach((p, i) => {
        const cx = x(i);
        const cy = y(p.y);
        svg.appendChild(el("circle", { cx: String(cx), cy: String(cy), r: "4", fill: "#1e5bff" }));
        svg.appendChild(el("text", { x: String(cx), y: String(h - 12), fill: "#6b7280", "font-size": "12", "text-anchor": "middle" }, [p.x]));
      });
      return svg;
    }

        ]);

        const questionBox = el("div", { class: "detailBox" }, [d.questionText || "-"]);
        const msgBox = el("div", { class: "detailBox" }, []);
        function parseWithdrawnContent(content) {
          const raw = content == null ? "" : String(content);
          if (raw.startsWith("WITHDRAWN::")) {
            const encoded = raw.substring("WITHDRAWN::".length);
            if (!encoded) return { withdrawn: true, original: "" };
            try {
              const decoded = atob(encoded);
              return { withdrawn: true, original: decoded };
            } catch (e) {
              return { withdrawn: true, original: "" };
            }
          }
          if (raw.trim() === "(已撤回)") {
            return { withdrawn: true, original: "" };
          }
          return { withdrawn: false, original: raw };
        }
        (d.messages || []).forEach(m => {
          const withdrawBtn = el("button", { class: "iconAction", text: "↩", type: "button" });
          const delBtn = el("button", { class: "iconAction", text: "🗑", type: "button" });
          const parsed = parseWithdrawnContent(m.content);
          const isWithdrawn = !!parsed.withdrawn;
          withdrawBtn.disabled = isWithdrawn;

          withdrawBtn.addEventListener("click", async (ev) => {
            ev.stopPropagation();
            toast.textContent = "";
            if (!m.id) {
              toast.textContent = "该记录不支持撤回（缺少ID）";

            }

            delBtn.disabled = true;
            try {
              await apiJson("/api/v1/admin/qa-tickets/messages/" + m.id, { method: "DELETE" });
              await loadDetail(id);

            ]),
            el("div", { style: "margin-top: 6px; color: #374151; font-size: 13px;" }, [isWithdrawn ? "(已撤回)" : (parsed.original || "-")])
          ]));
        });
        if (!(d.messages || []).length) {
          msgBox.textContent = "暂无处理记录";
        }

        const replyInput = el("textarea", { class: "replyArea", placeholder: "输入回复内容…" });
        const draftKey = String(id);
        replyInput.value = s.replyDraftMap[draftKey] || "";
        replyInput.addEventListener("input", () => { s.replyDraftMap[draftKey] = replyInput.value; });
        const btnReply = el("button", { class: "replyBtn", type: "button", text: "仅回复" });
        const btnPublish = el("button", { class: "replyBtn green", type: "button", text: "回复并作为FAQ发布" });
        const btnClose = el("button", { class: "replyBtn gray", type: "button", text: "关闭工单" });

        let sending = false;
        async function doReply(publish, close) {
          if (sending) return;
          const text = replyInput.value.trim();
          if (!text) {
            toast.textContent = "请输入回复内容";
            return;
          }
          s.replyDraftMap[draftKey] = replyInput.value;
          toast.textContent = "";
          sending = true;
          btnReply.disabled = true;
          btnPublish.disabled = true;
          btnClose.disabled = true;
          try {
            const after = await apiJson("/api/v1/admin/qa-tickets/" + id + "/reply", {
              method: "POST",
              body: JSON.stringify({ content: text, publishAsFaq: !!publish, closeTicket: !!close })
            });
            replyInput.value = "";
            s.replyDraftMap[draftKey] = "";
            if (publish && after && after.matchedFaqId != null) {
              saveKnowledgeContent(after.matchedFaqId, text);
            }
            await loadDetail(id);
            await loadList();
          } catch (e) {

            sending = false;
            btnReply.disabled = false;
            btnPublish.disabled = false;
            btnClose.disabled = false;
          }
        }
        btnReply.addEventListener("click", () => doReply(false, false));
        btnPublish.addEventListener("click", () => doReply(true, false));
        btnClose.addEventListener("click", async () => {
          if (sending) return;
          sending = true;
          btnReply.disabled = true;

            await apiJson("/api/v1/admin/qa-tickets/" + id + "/close", { method: "POST" });

      function normalizePage(pageData) {

      async function fetchShowcases() {
        try {
          const pageData = await apiJson("/api/v1/admin/honors/page?" + buildQuery({
            page: 0,
            size: 100,
            keyword: s.keyword || undefined,
            awardYear: s.awardYear || undefined,
            recipientType: s.recipientType || undefined,
            publicVisible: s.publicVisible === "" ? undefined : s.publicVisible
          }));
          const items = normalizePage(pageData);
          function mergeRecipients(detailRecipients, pageRecipients) {
            const d = Array.isArray(detailRecipients) ? detailRecipients : [];
            const p = Array.isArray(pageRecipients) ? pageRecipients : [];
            if (!p.length) return d;
            const dMap = new Map();
            d.forEach(x => dMap.set(String(x && x.id != null ? x.id : ""), x));
            const merged = p.map(x => {
              const dx = dMap.get(String(x && x.id != null ? x.id : "")) || null;
              const out = Object.assign({}, dx || {}, x || {});
              if (dx && Array.isArray(dx.attachments)) out.attachments = dx.attachments;
              if (dx && dx.photoFileId != null) out.photoFileId = dx.photoFileId;
              if (dx && dx.photoUrl) out.photoUrl = dx.photoUrl;
              return out;
            });
            d.forEach(dx => {
              const id = String(dx && dx.id != null ? dx.id : "");
              if (!id) return;
              if (!merged.some(x => String(x && x.id != null ? x.id : "") === id)) merged.push(dx);
            });
            return merged;
          }
          return Promise.all(items.map(async item => {
            const detail = await apiJson("/api/v1/admin/honors/" + item.id).catch(() => item);
            const recPage = await apiJson("/api/v1/admin/honors/" + item.id + "/recipients/page?" + buildQuery({ page: 0, size: 100 })).catch(() => null);
            const pageRecipients = normalizePage(recPage || {});
            const detailRecipients = (detail && Array.isArray(detail.recipients)) ? detail.recipients : (item.recipients || []);
            return Object.assign({}, detail || item, { recipients: mergeRecipients(detailRecipients, pageRecipients) });
          }));
        } catch (e) {
          apiReady = false;
          return loadLocal();
        }
      }

      async function saveShowcase(item) {
        const payload = {
          awardYear: Number(item.awardYear),
          honorCategory: item.honorCategory,
          recipientType: item.recipientType,
          title: item.title,
          description: item.description || "",
          publicVisible: !!item.publicVisible,
          displayOrder: Number(item.displayOrder || 0),
          displayStartAt: item.displayStartAt || null,
          displayEndAt: item.displayEndAt || null,
          importTaskId: item.importTaskId || null

        if (apiReady) {
          try {
            if (item.id) await apiJson("/api/v1/admin/honors/" + item.id, { method: "PUT", body: JSON.stringify(payload) });
            else await apiJson("/api/v1/admin/honors", { method: "POST", body: JSON.stringify(payload) });
            await loadHonorScholarships(Object.assign({}, s, { selectedId: item.id }));
            return;
          } catch (e) {
            apiReady = false;
          }
        }
        const all = loadLocal();
        if (item.id) {
          const idx = all.findIndex(x => String(x.id) === String(item.id));
          if (idx >= 0) all[idx] = Object.assign({}, all[idx], item);
        } else {
          item = Object.assign({}, item, { id: nextId(all), recipients: [] });
          all.unshift(item);
        }
        saveLocal(all);
        await loadHonorScholarships(Object.assign({}, s, { selectedId: item.id }));
      }

          renderPhoto(localPreviewUrl);
        });
        showUserOverlay(recipient ? "编辑获得者详情" : "新增获得者");
        setUserModalContent([
          el("div", { class: "row" }, [
            el("div", { class: "field" }, [el("label", { text: showcase.recipientType === "COLLECTIVE" ? "集体名称" : "姓名" }), name]),
            el("div", { class: "field" }, [el("label", { text: "学号" }), no]),
            el("div", { class: "field" }, [el("label", { text: "专业" }), major]),
            el("div", { class: "field" }, [el("label", { text: "年级" }), grade]),
            el("div", { class: "field" }, [el("label", { text: "班级" }), cls])
          ]),
          el("div", { class: "field" }, [el("label", { text: "照片" }), photoFile]),
          preview,
          el("div", { class: "field" }, [el("label", { text: "获奖简介" }), intro]),
          el("div", { class: "field" }, [el("label", { text: "先进事迹" }), deeds]),
          el("div", { class: "row" }, [
            el("label", { class: "cfgCheckRow" }, [publicVisible, el("span", { text: "公开展示" })]),
            el("div", { class: "field" }, [el("label", { text: "展示顺序" }), order]),
            el("div", { class: "field" }, [el("label", { text: "展示开始" }), start]),
            el("div", { class: "field" }, [el("label", { text: "展示结束" }), end])
          ])
        ], [
          el("button", { class: "btn primary", type: "button", text: "保存", onclick: async () => {
            if (!name.value.trim()) {
              document.getElementById("userModalMsg").textContent = "请填写获得者名称";
              return;
            }
            const payload = {
              recipientType: showcase.recipientType,
              studentId: values.studentId || null,
              studentNo: no.value.trim(),
              recipientName: name.value.trim(),
              major: major.value.trim(),
              grade: grade.value.trim(),
              className: cls.value.trim(),
              awardIntro: intro.value.trim(),
              advancedDeeds: deeds.value.trim(),
              photoFileId: values.photoFileId || null,
              publicVisible: publicVisible.checked,
              displayOrder: Number(order.value || 0),
              displayStartAt: start.value || null,
              displayEndAt: end.value || null,
              importTaskId: values.importTaskId || null
            };
            if (apiReady) {
              try {
                const saved = values.id
                  ? await apiJson("/api/v1/admin/honors/recipients/" + values.id, { method: "PUT", body: JSON.stringify(payload) })
                  : await apiJson("/api/v1/admin/honors/" + showcase.id + "/recipients", { method: "POST", body: JSON.stringify(payload) });
                const f = photoFile.files && photoFile.files[0] ? photoFile.files[0] : null;
                let photoWarn = "";
                if (f) {
                  try {
                    const fd = new FormData();
                    fd.append("file", f);
                    const uploadResp = await (async () => {
                      const resp = await apiFetch("/api/v1/platform/files/upload?bizType=HONOR_RECIPIENT_PHOTO&bizId=" + encodeURIComponent(saved.id), { method: "POST", body: fd });
                      const json = await resp.json().catch(() => null);
                      if (!resp.ok) throw new Error((json && json.message) ? json.message : ("请求失败(" + resp.status + ")"));
                      if (!json || !json.success) throw new Error((json && json.message) ? json.message : "请求失败");
                      return json.data;
                    })();

                    const current = await apiJson("/api/v1/admin/honors/recipients/" + saved.id).catch(() => saved);
                    const existingPhotos = (current && Array.isArray(current.attachments) ? current.attachments : []).filter(a => a.attachmentType === "PHOTO");
                    for (let i = 0; i < existingPhotos.length; i++) {
                      const att = existingPhotos[i];
                      await apiJson("/api/v1/admin/honors/attachments/" + att.id, {
                        method: "PUT",
                        body: JSON.stringify({
                          fileId: att.fileId || null,
                          attachmentType: att.attachmentType,
                          fileName: att.fileName,
                          contentType: att.contentType || null,
                          fileSize: att.fileSize || null,
                          storagePath: att.storagePath || null,
                          caption: att.caption || null,
                          publicVisible: att.publicVisible !== false,
                          displayOrder: Number(att.displayOrder || 0) + 1
                        })
                      });
                    }

                    await apiJson("/api/v1/admin/honors/recipients/" + saved.id + "/attachments", {
                      method: "POST",
                      body: JSON.stringify({
                        fileId: uploadResp.id,
                        attachmentType: "PHOTO",
                        fileName: uploadResp.fileName,
                        contentType: uploadResp.contentType || null,
                        fileSize: uploadResp.fileSize || null,
                        storagePath: uploadResp.storagePath || null,
                        caption: "照片",
                        publicVisible: true,
                        displayOrder: 0
                      })
                    });
                  } catch (e) {
                    photoWarn = String(e && e.message ? e.message : e);
                  }
                }
                await loadHonorScholarships(Object.assign({}, s, { selectedId: showcase.id }));
                hideUserOverlay();
                if (photoWarn) {
                  alert("获得者信息已保存，但照片保存失败：" + photoWarn);
                }
              } catch (e) {
                document.getElementById("userModalMsg").textContent = e.message;
                return;
              }
            } else {
              await saveRecipient(showcase, Object.assign({}, values, payload, { photoUrl: "", displayStartAt: start.value || "", displayEndAt: end.value || "" }));
              hideUserOverlay();
            }
          }})
        ]);
        const initPhoto = (values.attachments || []).find(a => a.attachmentType === "PHOTO") || null;
        renderPhotoAttachment(initPhoto);
      }

      function openImportDialog(showcase) {
        showUserOverlay("批量导入获得者");
        const fileInput = el("input", { type: "file", accept: ".xlsx,.xls" });
        setUserModalContent([
          el("div", { class: "honorImportHelp", text: "支持 Excel 导入（Sheet1）。列顺序：获得者名称、学号、专业、年级、班级、获奖简介、先进事迹、照片URL(可空)。首行表头会自动跳过。" }),
          el("div", { class: "field" }, [el("label", { text: "选择 Excel 文件" }), fileInput])
        ], [
          el("button", { class: "btn primary", type: "button", text: "导入", onclick: async () => {
            document.getElementById("userModalMsg").textContent = "";
            const f = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
            if (!f) {
              document.getElementById("userModalMsg").textContent = "请先选择 Excel 文件";
              return;
            }
            try {
              const fd = new FormData();
              fd.append("file", f);
              const resp = await apiFetch("/api/v1/admin/honors/" + showcase.id + "/recipients/import", { method: "POST", body: fd });
              const json = await resp.json().catch(() => null);
              if (!resp.ok) throw new Error((json && json.message) ? json.message : ("请求失败(" + resp.status + ")"));
              if (!json || !json.success) throw new Error((json && json.message) ? json.message : "请求失败");
              hideUserOverlay();
              await loadHonorScholarships(Object.assign({}, s, { selectedId: showcase.id }));
            } catch (e) {
              document.getElementById("userModalMsg").textContent = e.message;
            }
          }})
        ]);
      }

      const showcases = filteredLocal(await fetchShowcases());
      const selected = showcases.find(x => String(x.id) === String(s.selectedId)) || showcases[0] || null;
      if (selected) s.selectedId = selected.id;
      const keyword = el("input", { value: s.keyword || "", placeholder: "搜索年份、类别、标题" });
      const year = el("input", { value: s.awardYear || "", placeholder: "年份", list: yearListId, inputmode: "numeric" });
      const type = el("select", null, [el("option", { value: "", text: "全部类型" }), el("option", { value: "PERSONAL", text: "个人" }), el("option", { value: "COLLECTIVE", text: "集体" })]);
      type.value = s.recipientType || "";
      const publicVisible = el("select", null, [el("option", { value: "", text: "全部状态" }), el("option", { value: "true", text: "公开展示" }), el("option", { value: "false", text: "暂不公开" })]);
      publicVisible.value = s.publicVisible;

      function doFilter() {
        loadHonorScholarships({ keyword: keyword.value.trim(), awardYear: year.value.trim(), recipientType: type.value, publicVisible: publicVisible.value, selectedId: s.selectedId });
      }

      const totalRecipients = showcases.reduce((sum, x) => sum + ((x.recipients || []).length || Number(x.recipientCount || 0)), 0);
      content.appendChild(el("div", { class: "honorHero" }, [
        el("div", null, [
          el("h2", { text: "奖助信息" }),
          el("div", { class: "desc", text: apiReady ? "管理年份、类别、个人/集体展示模块与获得者风采内容。" : "当前后端接口未接入，已启用本地演示数据，界面功能可直接试用。" })
        ]),
        el("div", { class: "honorActions" }, [
          el("button", { class: "btn primary", type: "button", text: "新建模块", onclick: () => openShowcaseForm(null) }),
          selected ? el("button", { class: "btn green", type: "button", text: "新增获得者", onclick: () => openRecipientForm(selected, null) }) : null,
          selected ? el("button", { class: "btn", type: "button", text: "批量导入", onclick: () => openImportDialog(selected) }) : null
        ])
      ]));
      content.appendChild(el("div", { class: "honorStats" }, [
        el("div", { class: "honorStat" }, [el("div", { class: "k", text: "展示模块" }), el("div", { class: "v", text: String(showcases.length) })]),
        el("div", { class: "honorStat" }, [el("div", { class: "k", text: "获得者" }), el("div", { class: "v", text: String(totalRecipients) })]),
        el("div", { class: "honorStat" }, [el("div", { class: "k", text: "公开模块" }), el("div", { class: "v", text: String(showcases.filter(x => x.publicVisible !== false).length) })]),
        el("div", { class: "honorStat" }, [el("div", { class: "k", text: "当前类别" }), el("div", { class: "v", text: selected ? recipientTypeText(selected.recipientType) : "-" })])
      ]));
      content.appendChild(el("div", { class: "honorFilters" }, [
        buildYearDatalist(),
        el("div", { class: "row" }, [
          el("div", { class: "field" }, [el("label", { text: "关键词" }), keyword]),
          el("div", { class: "field" }, [el("label", { text: "年份" }), year]),
          el("div", { class: "field" }, [el("label", { text: "类型" }), type]),
          el("div", { class: "field" }, [el("label", { text: "公开状态" }), publicVisible]),
          el("div", { class: "field", style: "justify-content:flex-end;" }, [el("button", { class: "btn primary", type: "button", text: "筛选", onclick: doFilter })])
        ])
      ]));
      keyword.addEventListener("keydown", e => { if (e.key === "Enter") doFilter(); });
      [year, type, publicVisible].forEach(x => x.addEventListener("change", doFilter));

      const list = el("div", { class: "card" }, [
        el("div", { class: "sectionTitle", text: "展示模块" }),
        showcases.length ? el("div", { class: "honorShowcaseList" }, showcases.map(item => {
          const card = el("div", { class: "honorShowcaseCard" + (selected && String(selected.id) === String(item.id) ? " active" : "") }, [
            el("div", { class: "honorBlueBlock", text: item.title || ((item.awardYear || "") + "年" + (item.honorCategory || "")) }),
            el("div", { class: "honorMeta" }, [
              el("span", { text: (item.awardYear || "-") + "年" }),
              el("span", { text: item.honorCategory || "-" }),
              el("span", { text: recipientTypeText(item.recipientType) }),
              el("span", { text: "排序 " + (item.displayOrder || 0) }),
              visiblePill(item.publicVisible !== false)
            ]),
            el("div", { class: "honorExcerpt", text: item.description || "暂无整体简介" })
          ]);
          card.addEventListener("click", () => loadHonorScholarships(Object.assign({}, s, { selectedId: item.id })));
          return card;
        })) : el("div", { class: "honorEmpty", text: "暂无展示模块，请新建一个奖助信息模块。" })
      ]);
      const detailChildren = [];
      if (!selected) {
        detailChildren.push(el("div", { class: "honorEmpty", text: "请选择或新建一个展示模块。" }));
      } else {
        const recipients = (selected.recipients || []).slice().sort((a, b) => Number(a.displayOrder || 0) - Number(b.displayOrder || 0));
        detailChildren.push(el("div", { class: "honorDetailTitle" }, [
          el("div", null, [
            el("h3", { text: selected.title || "-" }),
            el("div", { class: "honorMeta" }, [
              el("span", { text: selected.awardYear + "年" }),
              el("span", { text: selected.honorCategory || "-" }),
              el("span", { text: recipientTypeText(selected.recipientType) }),
              el("span", { text: "时效：" + validText(selected) })
            ])
          ]),
          el("div", { class: "iconActions" }, [
            el("button", { class: "iconAction", type: "button", title: "编辑模块", text: "✎", onclick: () => openShowcaseForm(selected) }),
            el("button", { class: "iconAction", type: "button", title: "删除模块", text: "×", onclick: () => deleteShowcase(selected) })
          ])
        ]));
        detailChildren.push(el("div", { class: "sub", text: selected.description || "暂无整体简介" }));
        detailChildren.push(el("div", { class: "sectionTitle", text: "获得者详情" }));
        detailChildren.push(recipients.length ? el("div", { class: "honorRecipientGrid" }, recipients.map(r => {
          const photoAtt = ((r.attachments || []).find(a => a.attachmentType === "PHOTO") || null);
          const fileId = photoAtt && photoAtt.fileId != null ? Number(photoAtt.fileId) : 0;
          const storageUrl = r.photoUrl || attachmentUrl(photoAtt);
          let avatar = el("div", { class: "honorAvatar", text: String(r.recipientName || "?").slice(0, 1) });
          if (fileId > 0) {
            const img = el("img", { class: "honorAvatar", alt: r.recipientName || "照片" });
            (async () => {
              try {
                const blob = await apiBlob("/api/v1/platform/files/" + fileId + "/download");
                img.src = URL.createObjectURL(blob);
                avatar.replaceWith(img);
                avatar = img;
              } catch (e) {}
            })();
          } else if (storageUrl) {
            avatar = el("img", { class: "honorAvatar", src: storageUrl, alt: r.recipientName || "照片" });
          }
          const card = el("div", { class: "honorRecipientCard" }, [
            el("div", { class: "honorRecipientHead" }, [
              avatar,
              el("div", null, [
                el("div", { class: "honorRecipientName", text: r.recipientName || "-" }),
                el("div", { class: "honorRecipientSub", text: [r.studentNo, r.grade, r.major, r.className].filter(Boolean).join(" · ") || recipientTypeText(r.recipientType) })
              ])
            ]),
            el("div", { class: "honorMeta" }, [visiblePill(r.publicVisible !== false), el("span", { text: "排序 " + (r.displayOrder || 0) }), el("span", { text: validText(r) })]),
            el("div", { class: "honorExcerpt", text: r.awardIntro || "暂无获奖简介" }),
            el("div", { class: "iconActions", style: "margin-top:10px;" }, [
              el("button", { class: "linkAction", type: "button", text: "查看/编辑", onclick: (e) => { e.stopPropagation(); openRecipientForm(selected, r); } }),
              el("button", { class: "linkAction danger", type: "button", text: "删除", onclick: (e) => { e.stopPropagation(); deleteRecipient(selected, r); } })
            ])
          ]);
          card.addEventListener("click", () => openRecipientForm(selected, r));
          return card;
        })) : el("div", { class: "honorEmpty", text: "暂无获得者，可点击新增或批量导入。" }));
      }
      content.appendChild(el("div", { class: "honorLayout" }, [list, el("div", { class: "card" }, detailChildren)]));
    }

    async function switchView(view, state) {
      const ok = await ensureLoggedIn();
      if (!ok) return;
      setActiveNav(view);
      if (view === "dashboard") return loadDashboard();
      if (view === "operationLogs") return loadOperationLogs();
      if (view === "knowledgePolicies") return loadPolicies(Object.assign({ keyword: "" }, state || {}));
      if (view === "knowledgeFaqs") return loadFaqManage(Object.assign({}, state || {}));
      if (view === "notices") return loadNoticeList(Object.assign({}, state || {}));
      if (view === "noticeList") return loadNoticeList(Object.assign({}, state || {}));
      if (view === "noticePublish") return loadNoticePublish(Object.assign({}, state || {}));
      if (view === "honorScholarships") return loadHonorScholarships(Object.assign({}, state || {}));
      if (view === "approvals") return loadApprovals(Object.assign({}, state || {}));
      if (view === "users") return loadUsers(Object.assign({}, state || {}));
      if (view === "roles") return loadRoles();
      if (view === "authAudits") return loadAuthAudits();
      if (view === "knowledgeAnalytics") return loadSearchAnalytics();
      if (view === "knowledgeTickets") return loadQaTickets(Object.assign({}, state || {}));
      if (view === "certTemplates") return loadCertTemplates(Object.assign({}, state || {}));
      if (view === "workflowDef") return loadWorkflowDefinitionsPage(Object.assign({}, state || {}));
      if (view === "workflowNodes") return loadWorkflowNodesConfig(Object.assign({}, state || {}));
      if (view === "workflowInstances") return loadWorkflowInstancesPage(Object.assign({}, state || {}));
      if (view === "partyFlowDef") return loadPartyFlowDef(Object.assign({}, state || {}));
      if (view === "partyFlowNodes") return loadPartyFlowNodesConfig(Object.assign({}, state || {}));
      if (view === "partyProgress") return loadPartyProgressOverviewPage(Object.assign({}, state || {}));
      if (view === "partyReminders") return loadPartyRemindersPage(Object.assign({}, state || {}));
      if (view === "academicPrograms") return loadAcademicProgramsPage(Object.assign({}, state || {}));
      if (view === "academicCourses") return loadAcademicCoursesPage(Object.assign({}, state || {}));
      if (view === "academicTerms") return loadAcademicTermsPage(Object.assign({}, state || {}));
      return renderPlaceholder("未实现页 bb面", "该菜单项暂未接入。");
    }

    document.querySelectorAll(".nav button[data-view]").forEach(btn => {
      btn.addEventListener("click", async () => {
        ensureGroupVisibleForButton(btn);
        await switchView(btn.dataset.view);
      });
    });

    document.getElementById("notifBtn").addEventListener("click", async (e) => {
      e.stopPropagation();
      const notifMenu = document.getElementById("notifMenu");
      const show = !notifMenu.classList.contains("show");
      hideAllMenus();
      if (show) {
        notifMenu.classList.add("show");
        await loadNotifList();
      }
    });

    document.getElementById("notifCloseBtn").addEventListener("click", () => {
      document.getElementById("notifMenu").classList.remove("show");
    });

    document.getElementById("notifRefreshBtn").addEventListener("click", async () => {
      await loadNotifList();
    });

    document.getElementById("profileBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      const profileMenu = document.getElementById("profileMenu");
      const show = !profileMenu.classList.contains("show");
      hideAllMenus();
      if (show) {
        profileMenu.classList.add("show");
      }
    });

    document.getElementById("profileCloseBtn").addEventListener("click", () => {
      document.getElementById("profileMenu").classList.remove("show");
    });

    document.addEventListener("click", (e) => {
      const notifBtn = document.getElementById("notifBtn");
      const profileBtn = document.getElementById("profileBtn");
      const notifMenu = document.getElementById("notifMenu");
      const profileMenu = document.getElementById("profileMenu");
      if (notifMenu.contains(e.target) || profileMenu.contains(e.target) || notifBtn.contains(e.target) || profileBtn.contains(e.target)) {
        return;
      }
      hideAllMenus();
    });

    document.getElementById("userOverlay").addEventListener("click", (e) => {
      if (e.target && e.target.id === "userOverlay") {
        hideUserOverlay();
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      clearAuth();
      showLoginOverlay("");
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const u = document.getElementById("loginUsername").value.trim();
      const p = document.getElementById("loginPassword").value;
      const msg = document.getElementById("loginMsg");
      msg.textContent = "";
      try {
        await doLogin(u, p);
        await switchView("dashboard");
      } catch (e) {
        msg.textContent = e.message;
      }
    });

    (async () => {
      initNavGroups();
      const user = getUser();
      if (user) setUser(user);
      const ok = await ensureLoggedIn();
      if (ok) await switchView("dashboard");
    })();
  </script>
</body>
</html>
